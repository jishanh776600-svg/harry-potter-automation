<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0e"><title>STORY FORGE — Operator Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--gold:#e3b85c;--ink:#090b0e;--line:#e3b85c33;--cream:#f5f0e6;--muted:#9b998f}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(90deg,#090b0eee,#090b0eb5),url('/static/img/story-forge-archive.png') center/cover;color:var(--cream);font-family:Inter,system-ui}.card{width:min(420px,100%);padding:35px;border:1px solid var(--line);border-radius:8px;background:#11120eee;box-shadow:0 30px 90px #0009}.mark{display:flex;align-items:center;gap:12px;margin-bottom:31px}.sigil{width:39px;height:39px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:22px Georgia}.eyebrow{font-size:10px;letter-spacing:.17em;color:var(--gold);text-transform:uppercase}.brand{font:600 19px Georgia,serif;letter-spacing:.12em}h1{font:400 30px Georgia,serif;margin:0 0 9px}p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 24px}label{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:14px 0 7px}input{width:100%;border:1px solid #ffffff24;border-radius:4px;padding:12px;background:#0a0b09;color:var(--cream);outline:none}input:focus{border-color:var(--gold)}button{width:100%;margin-top:22px;border:1px solid var(--gold);border-radius:4px;background:#c49a47;color:#17130a;padding:12px;font-weight:700;cursor:pointer}.error{display:none;margin-bottom:14px;border-left:2px solid #e17872;background:#3a181633;padding:9px;color:#f0aaa4;font:11px 'IBM Plex Mono',monospace}.foot{margin:19px 0 0;text-align:center;font:10px 'IBM Plex Mono',monospace;color:var(--muted)}</style></head><body><main class="card"><div class="mark"><span class="sigil">S</span><span><div class="brand">STORY FORGE</div><div class="eyebrow">Command Center</div></span></div><h1>Operator access</h1><p>Authenticate to view protected production telemetry and controls.</p><div id="error" class="error"></div><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Authenticate session</button></form><div class="foot">PBKDF2-HMAC · SESSION PROTECTED · RATE LIMITED</div></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let b=document.querySelector('#submit'),err=document.querySelector('#error');err.style.display='none';b.disabled=true;b.textContent='Verifying…';try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Authentication failed');location.replace(innerWidth<769?'/mobile':'/')}catch(x){err.textContent=x.message;err.style.display='block';b.disabled=false;b.textContent='Authenticate session'}}</script></body></html>
